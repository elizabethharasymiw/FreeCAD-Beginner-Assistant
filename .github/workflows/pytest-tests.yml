name: FreeCAD Addon Tests

on:
  push:
    branches: [ "testing-main" ]
  pull_request:
    branches: [ "testing-main" ]

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install FreeCAD
      run: |
        sudo add-apt-repository -y ppa:freecad-maintainers/freecad-stable
        sudo apt-get update
        sudo apt-get install -y freecad freecad-python3

    - name: Set PYTHONPATH for FreeCAD
      run: echo "/usr/lib/freecad/lib" >> $GITHUB_ENV

    - name: Install Python dependencies, and run tests
      run: |
        python -m venv testing-env
        source testing-env/bin/activate
        pip install -r requirements.txt
        export PYTHONPATH=$PYTHONPATH:/usr/lib/freecad/lib
        pytest
